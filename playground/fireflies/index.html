<style>
  /* Embedded in the home page's slider: never scrollable, and the scene is pinned to the bottom */
  html.is-embedded, html.is-embedded body { overflow: hidden; }
  html.is-embedded .stage { min-height: 0; }
  :root { --bg-bottom: #084469; --bg-top: #156BA4; --ink: #F8F8F7; }
  html, body { margin: 0; height: 100%; background: var(--bg-bottom); }
  /* Background + grain (Figma 1405:21207) in CSS: they always reach every edge,
     unlike an SVG noise filter, which browsers clip on large screens. */
  .stage {
    position: relative; width: 100%; height: 100vh; min-height: 480px; overflow: hidden;
    background: url(assets/grain.png) repeat, linear-gradient(to top, var(--bg-bottom), var(--bg-top));
  }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* The animated scene gets its own compositing layer so the grain below is never redrawn. */
  /* The whole frame always fits (the word is never cropped); fireflies may fly past it
     to the window edges, so the SVG doesn't clip them. */
  #scene { will-change: transform; overflow: visible; }
  /* Each glow inside the word breathes with its firefly's light. */
  .glow-spot circle { animation: ff-pulse-halo var(--pulse, 3.2s) ease-in-out var(--pulse-delay, 0s) infinite; }
  @media (prefers-reduced-motion: reduce) { .glow-spot circle { animation: none; } }

  /* Cursor: the system's own — normal arrow, open hand over a firefly, closed hand while
     dragging. It sits on one still, transparent shield over the scene and only changes when
     a hover starts or ends, so the animation underneath never makes the browser re-apply it
     (custom or hidden cursors flicker on Chrome/macOS for exactly that reason). */
  .stage { touch-action: none; }
  .cursor-shield { position: absolute; inset: 0; z-index: 5; cursor: default; }
  .stage.is-over .cursor-shield { cursor: grab; }
  .stage.is-holding .cursor-shield { cursor: grabbing; }
  #scene { pointer-events: none; }

  /* A tiny firefly spark that trails just below the pointer and twinkles,
     shedding specks of light that drift up and fade as you move. */
  /* The outer box only carries the position (set from JS); the dot and its twinkle live
     on ::before, so the twinkle never shifts where the spark sits. */
  .cursor-light {
    position: absolute; left: 0; top: 0; width: 6px; height: 6px; margin: 19px 0 0 11px;
    pointer-events: none; opacity: 0; transition: opacity .4s ease;
  }
  .cursor-light::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: #FFF8C4;
    box-shadow: 0 0 4px 1px rgba(255, 241, 81, .9), 0 0 12px 4px rgba(255, 241, 81, .35), 0 0 26px 10px rgba(255, 241, 81, .1);
  }
  .cursor-light.is-on { opacity: 1; }
  .cursor-light.is-on::before { animation: spark-twinkle 1.8s ease-in-out infinite; }
  @keyframes spark-twinkle {
    0%, 100% { transform: scale(.85); opacity: .85; }
    14%      { transform: scale(1.15); opacity: 1; }
    40%      { transform: scale(.95); opacity: .9; }
  }
  /* Specks meander up and away from the spark as they fade. */
  .cursor-speck {
    position: absolute; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%;
    pointer-events: none; background: #FFF6A8; box-shadow: 0 0 4px 1px rgba(255, 241, 81, .6);
    animation: speck-fade 1.1s ease-out forwards;
  }
  @keyframes speck-fade {
    0%   { transform: translate(0, 0) scale(var(--s)); opacity: .9; }
    35%  { transform: translate(calc(var(--dx) * .6), calc(var(--dy) * .35)) scale(var(--s)); opacity: .8; }
    70%  { transform: translate(calc(var(--dx) * -.3), calc(var(--dy) * .7)) scale(calc(var(--s) * .7)); opacity: .45; }
    100% { transform: translate(calc(var(--dx) * .4), var(--dy)) scale(calc(var(--s) * .3)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .cursor-light.is-on::before { animation: none; } .cursor-speck { display: none; } }

  /* Tooltip (Figma 1408:21352): Text xs/Semibold on bg-primary-solid, shadow-lg. */
  .ff-tooltip { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 10; }
  .ff-tooltip__pop {
    display: flex; flex-direction: column; align-items: center;
    transform: translate(-50%, calc(-100% - 6px)) scale(.6); transform-origin: 50% 100%; opacity: 0;
    filter: drop-shadow(0 12px 8px rgba(0,0,0,.08)) drop-shadow(0 4px 3px rgba(0,0,0,.03)) drop-shadow(0 2px 1px rgba(0,0,0,.04));
    transition: transform .14s ease-in, opacity .14s ease-in;
  }
  .ff-tooltip.is-shown .ff-tooltip__pop {
    transform: translate(-50%, calc(-100% - 6px)) scale(1); opacity: 1;
    transition: transform .32s cubic-bezier(.34, 1.56, .64, 1), opacity .12s ease-out;
  }
  .ff-tooltip__body {
    background: #0A0A0A; color: #fff; border-radius: 8px; padding: 8px 12px;
    font: 600 12px/18px Inter, system-ui, sans-serif; white-space: nowrap; text-align: center;
  }
  .ff-tooltip__arrow { display: block; margin-top: -1px; }

  /* Dizzy: stars circle its head, the light flickers, the wings lose their rhythm. */
  .firefly .ff-stars { display: none; }
  .firefly.is-dizzy .ff-stars { display: inline; }
  .firefly.is-dizzy .ff-wing { animation-duration: .27s; }
  .firefly.is-dizzy .ff-light { animation: ff-flicker .5s steps(2, jump-none) infinite; }
  .firefly.is-held .ff-wing { animation-duration: .06s; }
  @keyframes ff-flicker { 0% { opacity: 1; } 50% { opacity: .35; } 100% { opacity: .85; } }
</style>

<script>
  // Start positions and headings are the Figma frame (light centre, frame px).
  // From there each firefly meanders around the word and keeps dropping by to visit it;
  // the two `roam` ones range a little wider.
  //
  // Each has a mood: how it reacts when the cursor comes near (curious / shy / playful),
  // how fast and how lazy it is, how much dragging (`patience`, frame px) or how many
  // quick clicks (`clicks`) it takes to make it dizzy, and what it says.
  const Y = 'yellow', L = 'lemon';
  const FIREFLIES = [
    { figma: '1402:21109', type: 'large', x: 1618.5,  y: 934.05,  rot: 0,     halo: L, pulse: 3.4, delay: 0.2,
      mood: { name: 'Sunny', cursor: 'curious',
        lines: { hi: ['Hiiii..', 'Hello, you!', 'Nice night, huh?'], drag: ['Where are we going?', 'Wheee!'], dizzy: ['I’m dizzy..'], phew: 'Phew..' } } },
    { figma: '1402:21122', type: 'large', x: 1731.69, y: 1156.99, rot: 33.4,  halo: L, pulse: 2.9, delay: 1.7,
      mood: { name: 'Zippy', speed: 1.5, lazy: 0.4, patience: 1500, clicks: 4,
        lines: { hi: ['Can’t stop!', 'Zoom zoom!', 'Race you?'], drag: ['Faster!', 'Wheee!'], dizzy: ['Whoa.. again!'], phew: 'Again! Again!' } } },

      mood: { name: 'Pip',
        lines: { hi: ['Hiiii..'], drag: ['Wheee!'], dizzy: ['I’m dizzy..'], phew: 'Phew..' } } },
    { figma: '1402:21148', type: 'large', x: 596.51,  y: 614.27,  rot: -33.1, halo: L, pulse: 3.1, delay: 0.9, roam: true,
      mood: { name: 'Dozy', speed: 0.6, lazy: 2.2,

        lines: { hi: ['Eep!', 'Oh! Hi..', 'Don’t look at me..'], drag: ['Put me down!', 'Eeeep!'], dizzy: ['Please stop..'], phew: 'Okay.. okay..' } } },

    { figma: '1402:21183', type: 'small', x: 72.33,   y: 918.67,  rot: 0, mirror: true, halo: Y, pulse: 3.3, delay: 2.1, roam: true,
      mood: { name: 'Grumpy', patience: 450, clicks: 2,
        lines: { hi: ['What now?', 'Hmph.', 'Busy.'], drag: ['Unhand me!', 'Rude.'], dizzy: ['Ugh, my head..'], phew: 'Hmph.' } } },

      mood: { name: 'Glowy',

  const glow = document.getElementById('text-glow');
  const word = { x0: 311, y0: 791, x1: 1610, y1: 1128 };   // word outline bounds in the frame

</script>
